<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラクター設定集 | ふりはら美術館</title>
  <meta name="description" content="100フォロワー記念展・キャラクター設定集ページです。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/characters.css">
</head>
<body>

  <header class="site-header">
    <p class="site-header__mark">Solo Exhibition Museum</p>
    <p class="site-header__title">ふりはら美術館</p>

    <nav class="main-nav" aria-label="館内案内">
      <a href="index.html">エントランス</a>
      <a href="gallery.html">個展</a>
      <a href="characters.html">キャラクター設定集</a>
      <a href="desk.html">机探索</a>
      <a href="shop.html">お土産コーナー</a>
    </nav>
  </header>

  <main>
    <section class="characters-intro">
      <p class="characters-intro__eyebrow">Room 02</p>
      <h1 class="characters-intro__title">キャラクター設定集</h1>
      <p class="characters-intro__lead">
        <!-- ★挨拶文はあとで自由に書き換えてください -->
        創作キャラクターの資料室です。名前をクリックすると、
        プロフィールや設定をまあまあ詳しくご覧いただけます。
      </p>
    </section>

    <!-- ============================================================
         キャラクター一覧グリッド
         中身は js/characters.js が data/characters.js を読み込んで
         自動生成する。このHTMLファイル自体は編集不要。
         (キャラを増やすときは data/characters.js を編集)
         ============================================================ -->
    <section class="section">
      <div id="characters-grid" class="characters-grid">
        <!-- ここにキャラクターカードがJavaScriptで自動的に挿入されます -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ふりはら美術館. 100フォロワー記念展.</p>
  </footer>

  <!-- ============================================================
       キャラクタープロフィールモーダル
       普段は非表示。カードをクリックすると js/characters.js が
       中身を書き換えて表示する。
       ============================================================ -->
  <div id="character-modal" class="character-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="character-modal__panel">
      <button type="button" class="character-modal__close" aria-label="閉じる">×</button>

      <div class="character-modal__portrait">
        <img src="" alt="">
      </div>

      <div class="character-modal__body">
        <p class="character-modal__label">Profile</p>
        <h2 class="character-modal__name"></h2>
        <p class="character-modal__reading"></p>
        <p class="character-modal__catchcopy"></p>

        <div class="character-modal__ornament"></div>

        <!-- 誕生日・年齢などがここに自動で並ぶ(空の項目は非表示) -->
        <dl class="character-modal__profile-list"></dl>

        <p class="character-modal__description"></p>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <!-- キャラクターデータ → 表示用スクリプト の順で読み込む -->
  <script src="data/characters.js"></script>
  <script src="js/characters.js"></script>
</body>
</html>
